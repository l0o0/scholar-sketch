name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful main push CI run containing the reviewed candidate"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit SHA of that candidate"
        required: true
        type: string
      expected_xpi_sha512:
        description: "sha512:... value for the reviewed XPI, copied from candidate.json"
        required: true
        type: string
      version:
        description: "Exact package version, without v (for example 0.2.15)"
        required: true
        type: string
      host_evidence:
        description: "Native Zotero version, candidate checks, results and remaining limitations"
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Both stable and beta releases mutate the same floating release assets.
concurrency:
  group: scholar-sketch-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted promotion code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify and promote the existing candidate bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_XPI_SHA512: ${{ inputs.expected_xpi_sha512 }}
          RELEASE_VERSION: ${{ inputs.version }}
          HOST_EVIDENCE: ${{ inputs.host_evidence }}
        run: node scripts/release-promote.mjs

      - name: Preserve channel backups and promotion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-channel-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scaffold/release-backup/
          if-no-files-found: ignore
          retention-days: 90
