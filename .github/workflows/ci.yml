name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match package.json "packageManager"
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare verified candidate
        run: node scripts/release-candidate.mjs create

      - name: Upload candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: scholar-sketch-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scaffold/candidate/
          if-no-files-found: error
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check test ownership
        run: pnpm run test:suites:check

      - name: Unit tests
        run: pnpm run test:unit

      # This command builds fake-zotero before running its package and integration tests.
      - name: Fake Zotero tests
        run: pnpm run test:fake-zotero

  checks:
    name: Sketch checks
    runs-on: ubuntu-latest
    needs: [lint, build, tests]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'lint=%s build=%s tests=%s\n' "$LINT_RESULT" "$BUILD_RESULT" "$TEST_RESULT"
          test "$LINT_RESULT" = success && test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  # Real Zotero startup/unload and native windows still require host verification.
